# Retrieval regression gate. No LLM calls and no secrets: it re-scores BM25 (and, optionally, dense) retrieval
# on the pinned gold set and fails if a metric drops below eval/gate_baseline.json. See README "CI".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      # The corpus (100 papers) is fetched once per cache key. ingest waits 3 s between arXiv requests, so a
      # miss costs ~6-8 min. The key covers everything that changes the parsed text.
      - name: Restore corpus cache
        id: corpus
        uses: actions/cache@v4
        with:
          path: |
            data/pdfs
            data/metadata.jsonl
            data/parsed
          key: corpus-${{ hashFiles('eval/corpus_v1.txt', 'src/arxiv_rag/ingest.py', 'src/arxiv_rag/parse.py', 'requirements.txt') }}

      - name: Fetch and parse the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          python -m arxiv_rag.ingest --ids-file eval/corpus_v1.txt
          python -m arxiv_rag.parse

      # Chunking counts tokens with the embedding model's tokenizer, so even the BM25 gate needs the model files.
      - name: Restore embedding model cache
        uses: actions/cache@v4
        with:
          path: data/cache/models
          key: models-${{ hashFiles('requirements.txt') }}

      - name: Retrieval gate (BM25)
        run: python -m arxiv_rag.gate --retrievers bm25 --summary "$GITHUB_STEP_SUMMARY"

  # Dense retrieval gate. Advisory for now (continue-on-error): the first run embeds ~5.7k chunks on CPU
  # (~10-15 min), and the 0.01 tolerance for CPU/BLAS nondeterminism is unproven on GitHub runners.
  # Remove continue-on-error once a few runs show stable numbers.
  dense-gate:
    # Runs after the BM25 job so a cold run fetches the corpus from arXiv once, not twice in parallel.
    needs: test-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore corpus cache
        id: corpus
        uses: actions/cache@v4
        with:
          path: |
            data/pdfs
            data/metadata.jsonl
            data/parsed
          key: corpus-${{ hashFiles('eval/corpus_v1.txt', 'src/arxiv_rag/ingest.py', 'src/arxiv_rag/parse.py', 'requirements.txt') }}

      - name: Fetch and parse the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          python -m arxiv_rag.ingest --ids-file eval/corpus_v1.txt
          python -m arxiv_rag.parse

      - name: Restore model and embedding caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache/models
            data/cache/embeddings
          key: dense-${{ hashFiles('requirements.txt', 'eval/corpus_v1.txt', 'src/arxiv_rag/chunk.py', 'src/arxiv_rag/embed.py') }}

      - name: Retrieval gate (dense)
        run: python -m arxiv_rag.gate --retrievers dense --summary "$GITHUB_STEP_SUMMARY"
